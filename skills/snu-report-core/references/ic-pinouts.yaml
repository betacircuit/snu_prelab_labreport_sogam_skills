# 74 시리즈 (DIP-14) 게이트 핀 배치
# 모든 칩: VCC = 14, GND = 7
# 각 gate: [입력 핀들..., 출력 핀]
# ⚠ 실습에서 실제로 받는 칩 번호/계열(LS, HC, HCT)이 다르면 여기만 수정.
#   HC/HCT는 핀 배치는 같지만 전기적 특성(tpd, V_IH/V_IL)이 다르다.

chips:
  "7400":  { func: NAND, inputs: 2, gates: [[1, 2, 3], [4, 5, 6], [9, 10, 8], [12, 13, 11]] }
  "7402":  { func: NOR,  inputs: 2, gates: [[2, 3, 1], [5, 6, 4], [8, 9, 10], [11, 12, 13]] }   # 출력 핀이 먼저!
  "7404":  { func: NOT,  inputs: 1, gates: [[1, 2], [3, 4], [5, 6], [9, 8], [11, 10], [13, 12]] }
  "7408":  { func: AND,  inputs: 2, gates: [[1, 2, 3], [4, 5, 6], [9, 10, 8], [12, 13, 11]] }
  "7410":  { func: NAND, inputs: 3, gates: [[1, 2, 13, 12], [3, 4, 5, 6], [9, 10, 11, 8]] }
  "7411":  { func: AND,  inputs: 3, gates: [[1, 2, 13, 12], [3, 4, 5, 6], [9, 10, 11, 8]] }
  "7420":  { func: NAND, inputs: 4, gates: [[1, 2, 4, 5, 6], [9, 10, 12, 13, 8]] }             # 3, 11번 NC
  "7427":  { func: NOR,  inputs: 3, gates: [[1, 2, 13, 12], [3, 4, 5, 6], [9, 10, 11, 8]] }
  "7432":  { func: OR,   inputs: 2, gates: [[1, 2, 3], [4, 5, 6], [9, 10, 8], [12, 13, 11]] }
  "7486":  { func: XOR,  inputs: 2, gates: [[1, 2, 3], [4, 5, 6], [9, 10, 8], [12, 13, 11]] }

# 게이트 종류 → 우선 사용할 칩 (입력 개수별). 없으면 2입력 칩으로 체인 분해.
prefer:
  NOT:  { 1: "7404" }
  AND:  { 2: "7408", 3: "7411" }
  OR:   { 2: "7432" }
  NAND: { 2: "7400", 3: "7410", 4: "7420" }
  NOR:  { 2: "7402", 3: "7427" }
  XOR:  { 2: "7486" }

# 참고용 전기적 특성 (datasheet typical, VCC=5V). 보고서 비교 기준.
# 실제 사용 칩 datasheet 값으로 교체할 것.
timing_typ_ns:
  74LS00: { tPLH: 9, tPHL: 10 }
  74LS04: { tPLH: 9, tPHL: 10 }
  74LS08: { tPLH: 8, tPHL: 10 }
  74LS32: { tPLH: 14, tPHL: 14 }
  74LS86: { tPLH: 12, tPHL: 10 }
  74HC00: { tpd: 8 }
  74HC04: { tpd: 8 }
  74HC08: { tpd: 7 }
  74HC32: { tpd: 8 }
  74HC86: { tpd: 11 }
